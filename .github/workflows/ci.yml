name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Windows uses the MinGW-w64 GCC on the runner's PATH here. Windows arm64
  # (llvm-mingw) is built and tested in package.yml.
  build:
    name: ${{ matrix.os }} headless
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-24.04-arm runs the AArch64 native debugger tests on real
        # hardware.
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, windows-2022]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CMake and Ninja
        run: python -m pip install --upgrade cmake ninja
      - name: Configure
        run: cmake --preset headless-${{ startsWith(matrix.os, 'macos') && 'macos' || startsWith(matrix.os, 'windows') && 'windows' || 'linux' }}
      - name: Build
        run: cmake --build --preset headless-${{ startsWith(matrix.os, 'macos') && 'macos' || startsWith(matrix.os, 'windows') && 'windows' || 'linux' }} --parallel
      - name: Test
        run: ctest --preset headless-${{ startsWith(matrix.os, 'macos') && 'macos' || startsWith(matrix.os, 'windows') && 'windows' || 'linux' }} --parallel 4
      # Stack one level of the type library comparison takes with this host's compiler (AppleClang
      # on macOS arm64), checked against its depth limit (src/project/typelib_apply.cpp, kMaxDepth).
      - name: Type comparison stack use
        if: ${{ !startsWith(matrix.os, 'windows') }}
        run: sh tools/ci/comparison-stack.sh
      # Measured decompiler corpus outcomes (docs/SUPPORT_MATRIX.md).
      - name: Decompiler corpus results
        if: always()
        run: cmake "-DREPORT=build/headless-${{ startsWith(matrix.os, 'macos') && 'macos' || startsWith(matrix.os, 'windows') && 'windows' || 'linux' }}/tests/decompiler-corpus-report.json" -P cmake/checks/corpus_summary.cmake
      # Failures again, alone and with their output, at the end of the log.
      - name: Failed tests in detail
        if: failure()
        run: ctest --preset headless-${{ startsWith(matrix.os, 'macos') && 'macos' || startsWith(matrix.os, 'windows') && 'windows' || 'linux' }} --rerun-failed --output-on-failure

  gui-linux:
    name: ubuntu-24.04 desktop shell (Xvfb)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CMake, Ninja and SDL3 build dependencies
        run: |
          python -m pip install --upgrade cmake ninja
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxss-dev \
            libxtst-dev libxfixes-dev libxkbcommon-dev libwayland-dev libdecor-0-dev \
            libegl1-mesa-dev libgl1-mesa-dev libvulkan-dev libdbus-1-dev libudev-dev \
            xvfb mesa-vulkan-drivers fonts-dejavu-core
      - name: Configure
        run: cmake --preset dev-linux -DDONKEY_UI_SMOKE_TEST=ON
      - name: Build
        run: cmake --build --preset dev-linux --parallel
      - name: Test (UI smoke tests on Xvfb with Mesa lavapipe)
        env:
          XDG_RUNTIME_DIR: /tmp/xdg-runtime
        run: |
          mkdir -p -m 700 "$XDG_RUNTIME_DIR"
          xvfb-run -a -s "-screen 0 1600x1000x24" ctest --preset dev-linux --parallel 4

  format:
    name: clang-format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Pinned to the version the tree is formatted with. An unpinned install follows PyPI, and
      # later releases format some lines differently, so the check would fail without a source change.
      - name: Install clang-format
        run: python -m pip install clang-format==20.1.8
      - name: Check formatting
        run: |
          find include src apps tests -type f \( -name '*.h' -o -name '*.cpp' \) \
            -print0 | xargs -0 clang-format --dry-run --Werror

  # The R1 measurement and its ratchet (G20-T2, T3; tools/r1/README.md): fetch and build the real
  # programs, decompile and measure every binary, and fail when a ratcheted count gets worse than
  # tools/r1/baseline.json as it is at the base commit.
  r1:
    name: R1 measurement and ratchet
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          # The base commit's baseline, and its CLI when the bytes changed.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CMake, Ninja and the R1 toolchains
        run: |
          python -m pip install --upgrade cmake ninja
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu libc6-dev-arm64-cross musl-tools
      - name: Build donkey-cli and donkey-r1 (Release)
        run: |
          cmake -S . -B build/r1 -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DDONKEY_BUILD_TESTS=OFF -DDONKEY_BUILD_R1_TOOL=ON
          cmake --build build/r1 --parallel --target donkey-cli donkey-r1
      # A download that keeps failing ends here, as a fetch failure, never as a ratchet result.
      - name: Fetch R1
        run: cmake -DR1_WORK="$RUNNER_TEMP/r1" -DR1_STEP=fetch -P tools/r1/build.cmake
      - name: Build R1
        run: cmake -DR1_WORK="$RUNNER_TEMP/r1" -DR1_STEP=build -P tools/r1/build.cmake
      - name: Decompile R1
        run: |
          cmake -DR1_WORK="$RUNNER_TEMP/r1" -DDONKEY_CLI="$PWD/build/r1/apps/donkey-cli/donkey-cli" \
            -DOUT="$RUNNER_TEMP/r1-out/decompiled" -P tools/r1/decompile.cmake
      # Exit status 2 means some binary had an error; the ratchet counts errors, so go on.
      - name: Measure R1
        run: |
          status=0
          build/r1/donkey-r1 measure "$RUNNER_TEMP/r1" "$RUNNER_TEMP/r1-out/decompiled" \
            "$RUNNER_TEMP/r1-out/result.json" "$RUNNER_TEMP/r1-out/table.md" || status=$?
          cat "$RUNNER_TEMP/r1-out/table.md" >> "$GITHUB_STEP_SUMMARY"
          test "$status" -eq 0 || test "$status" -eq 2
      - name: Ratchet
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          # A new branch's first push has no previous commit: compare with its parent.
          if [ -z "$BASE" ] || [ "$BASE" = 0000000000000000000000000000000000000000 ] || \
             ! git cat-file -e "$BASE^{commit}" 2> /dev/null; then
            BASE=$(git rev-parse HEAD~1)
          fi
          echo "r1: the base commit is $BASE"
          sh tools/r1/ci-check.sh "$BASE" "$RUNNER_TEMP/r1" build/r1 "$RUNNER_TEMP/r1-out"
      - name: Upload the R1 result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r1-result
          path: |
            ${{ runner.temp }}/r1-out/*.json
            ${{ runner.temp }}/r1-out/*.md
          if-no-files-found: ignore
