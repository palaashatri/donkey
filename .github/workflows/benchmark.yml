name: benchmark

# Manual only (G16-T1): the scale benchmarks are not run on pull requests. Two jobs, both through
# tools/bench/scale_benchmark.py: generated programs of four sizes, and a real large binary (the
# LLVM 18 shared library, from the pinned Ubuntu package). See docs/BENCHMARKS.md.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scale:
    name: scale benchmark (ubuntu-24.04)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CMake and Ninja
        run: python -m pip install --upgrade cmake ninja
      - name: Configure and build donkey-cli
        run: |
          cmake --preset headless-linux
          cmake --build --preset headless-linux --parallel --target donkey-cli
      - name: Scale benchmark (generated programs)
        run: >
          python3 tools/bench/scale_benchmark.py
          --cli build/headless-linux/apps/donkey-cli/donkey-cli
          --work bench-work
          --sizes 2000 10000 20000 40000
          --json bench-results.json
      - uses: actions/upload-artifact@v4
        with:
          name: scale-benchmark
          path: bench-results.json

  real-binary:
    name: real large binary (ubuntu-24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CMake and Ninja
        run: python -m pip install --upgrade cmake ninja
      # The input is the LLVM 18 runtime library from the Ubuntu archive, at one exact package version.
      # apt checks the package signature; the SHA-256 of the file is recorded in the artifact.
      - name: Install the pinned LLVM 18 runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y libllvm18=1:18.1.3-1ubuntu1
          sha256sum /usr/lib/llvm-18/lib/libLLVM.so.1 | tee llvm-library.sha256
      - name: Configure and build donkey-cli (Release)
        run: |
          cmake --preset headless-linux -DCMAKE_BUILD_TYPE=Release
          cmake --build --preset headless-linux --parallel --target donkey-cli
      - name: Real-binary benchmark (libLLVM.so.1)
        run: |
          for budget in 1000000 10000000; do
            python3 tools/bench/scale_benchmark.py \
              --cli build/headless-linux/apps/donkey-cli/donkey-cli \
              --work "bench-work-$budget" \
              --binary /usr/lib/llvm-18/lib/libLLVM.so.1 \
              --max-instructions "$budget" \
              --json "llvm-$budget.json"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: real-binary-benchmark
          path: |
            llvm-*.json
            llvm-library.sha256
